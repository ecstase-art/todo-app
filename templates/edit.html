<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактировать задачу</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>✏️ Редактировать задачу</h1>
    <form method="POST" class="edit-form">
        <div>
            <label for="task">Текст задачи:</label>
            <input type="text" id="task" name="task" value="{{ task[1] }}" required>
        </div>
        <div>
            <label for="deadline">Дедлайн:</label>
            <input type="datetime-local" id="deadline" name="deadline" value="{{ task[2].strftime('%Y-%m-%dT%H:%M') if task[2] else '' }}">
        </div>
        <div>
            <label for="notify_minutes">Оповещение за (мин):</label>
            <input type="number" id="notify_minutes" name="notify_minutes" value="{{ task[3] or 0 }}" min="0">
        </div>
        <div>
            <label for="completed">Выполнено:</label>
            <input type="checkbox" id="completed" name="completed" {% if task[4] %}checked{% endif %}>
        </div>
        <div>
            <button type="submit">Сохранить</button>
        </div>
    </form>
    <a href="{{ url_for('index') }}" class="back-link">← Вернуться к списку</a>
</body>
</html>
