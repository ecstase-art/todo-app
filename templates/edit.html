<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактировать задачу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        form div {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 150px;
        }
        input[type="text"], input[type="datetime-local"], input[type="number"] {
            padding: 5px;
            width: 70%;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 8px 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>✏️ Редактировать задачу</h1>
    <form method="POST">
        <div>
            <label for="task">Текст задачи:</label>
            <input type="text" id="task" name="task" value="{{ task[1] }}" required>
        </div>
        <div>
            <label for="deadline">Дедлайн:</label>
            <input type="datetime-local" id="deadline" name="deadline" value="{{ task[2].strftime('%Y-%m-%dT%H:%M') if task[2] else '' }}">
        </div>
        <div>
            <label for="notify_minutes">Оповещение за (мин):</label>
            <input type="number" id="notify_minutes" name="notify_minutes" value="{{ task[3] or 0 }}" min="0">
        </div>
        <div>
            <button type="submit">Сохранить</button>
        </div>
    </form>
    <a href="{{ url_for('index') }}">← Вернуться к списку</a>
</body>
</html>
