<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать задачу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h1 class="h4 mb-0">✏️ Редактировать задачу</h1>
            </div>
            <div class="card-body">
                <form method="POST" class="edit-form">
                    <div class="mb-3">
                        <label for="task" class="form-label">Текст задачи:</label>
                        <input type="text" id="task" name="task" class="form-control" value="{{ task[1] }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="deadline" class="form-label">Дедлайн:</label>
                        <input type="datetime-local" id="deadline" name="deadline" class="form-control" value="{{ task[2].strftime('%Y-%m-%dT%H:%M') if task[2] else '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="notify_minutes" class="form-label">Оповещение за (мин):</label>
                        <input type="number" id="notify_minutes" name="notify_minutes" class="form-control" value="{{ task[3] or 0 }}" min="0">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="completed" name="completed" {% if task[4] %}checked{% endif %}>
                        <label class="form-check-label" for="completed">Выполнено</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">← Вернуться к списку</a>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
