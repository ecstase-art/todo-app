<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <style>
        .task-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-text {
            flex: 1;
        }
        .task-deadline {
            margin: 0 15px;
            color: #555;
        }
        .highlight {
            background-color: #ffcccc;
            border-color: #ff0000;
        }
        .delete-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
        form input, form button {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>📋 Список задач</h1>
    <form method="POST">
        <input type="text" name="task" placeholder="Новая задача" required>
        <input type="datetime-local" name="deadline" placeholder="Дедлайн">
        <input type="number" name="notify_minutes" placeholder="Минуты до оповещения" min="0">
        <button type="submit">Добавить</button>
    </form>

    <ul style="list-style: none; padding: 0;">
        {% for task in tasks %}
            <li class="task-item {% if task[4] %}highlight{% endif %}">
                <span class="task-text">{{ task[1] }}</span>
                <span class="task-deadline">
                    {% if task[2] %}
                        Дедлайн: {{ task[2].strftime('%d.%m.%Y %H:%M') }}
                        {% if task[3] %}
                            (оповестить за {{ task[3] }} мин.)
                        {% endif %}
                    {% else %}
                        Без дедлайна
                    {% endif %}
                </span>
                <form method="POST" style="display: inline;">
                    <input type="hidden" name="delete_id" value="{{ task[0] }}">
                    <button type="submit" class="delete-btn">Удалить</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
