<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        #current-time {
            font-size: 1.2em;
            color: #555;
        }
        .task-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            transition: background-color 0.2s;
        }
        .task-text {
            flex: 1;
        }
        .task-deadline {
            margin: 0 15px;
            color: #555;
        }
        /* Жёлтый — есть оповещение */
        .notification {
            background-color: #fff3cd;
            border-color: #ffc107;
        }
        /* Красный — просрочено */
        .overdue {
            background-color: #f8d7da;
            border-color: #dc3545;
        }
        /* Кнопка удаления — красный кружок с крестиком */
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 20px;
            line-height: 30px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            margin-left: 10px;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        form input, form button {
            margin: 5px 0;
            padding: 5px;
        }
        form input[type="text"] {
            width: 60%;
        }
        form input[type="datetime-local"], form input[type="number"] {
            width: 20%;
        }
        form button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 6px 12px;
            cursor: pointer;
        }
        form button[type="submit"]:hover {
            background-color: #45a049;
        }
        a {
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Список задач</h1>
        <div id="current-time"></div>
    </div>

    <form method="POST">
        <input type="text" name="task" placeholder="Новая задача" required>
        <input type="datetime-local" name="deadline" placeholder="Дедлайн">
        <input type="number" name="notify_minutes" placeholder="Минуты до оповещения" min="0">
        <button type="submit">Добавить</button>
    </form>

    <ul style="list-style: none; padding: 0;">
        {% for task in tasks %}
            <li class="task-item
                {% if task[4] %}overdue
                {% elif task[2] and task[3] %}notification
                {% endif %}">
                <span class="task-text">{{ task[1] }}</span>
                <span class="task-deadline">
                    {% if task[2] %}
                        Дедлайн: {{ task[2].strftime('%d.%m.%Y %H:%M') }}
                        {% if task[3] %}
                            (оповестить за {{ task[3] }} мин.)
                        {% endif %}
                    {% else %}
                        Без дедлайна
                    {% endif %}
                </span>
                <div style="display: flex; align-items: center;">
                    <a href="{{ url_for('edit_task', task_id=task[0]) }}" style="margin-right: 10px;">✏️</a>
                    <form method="POST" style="display: inline;">
                        <input type="hidden" name="delete_id" value="{{ task[0] }}">
                        <button type="submit" class="delete-btn">×</button>
                    </form>
                </div>
            </li>
        {% endfor %}
    </ul>

    <script>
        function updateTime() {
            const now = new Date();
            const options = {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            document.getElementById('current-time').textContent = now.toLocaleDateString('ru-RU', options);
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
