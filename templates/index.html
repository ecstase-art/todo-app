<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <h1>📋 Список задач</h1>
        <div class="clock-container">
            <canvas id="clock" width="160" height="160"></canvas>
            <div id="current-date"></div>
        </div>
    </div>

    <form method="POST" id="task-form">
        <input type="text" name="task" placeholder="Новая задача" required>
        <input type="datetime-local" name="deadline" id="deadline-input" placeholder="Дедлайн">
        <input type="number" name="notify_minutes" placeholder="Минуты до оповещения" min="0">
        <button type="submit">Добавить</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li class="task-item {{ task[5] }}">
                <span class="task-text {% if task[4] %}completed-text{% endif %}">{{ task[1] }}</span>
                <span class="task-deadline">
                    {% if task[2] %}
                        Дедлайн: {{ task[2].strftime('%d.%m.%Y %H:%M') }}
                        {% if task[3] %}
                            (оповестить за {{ task[3] }} мин.)
                        {% endif %}
                    {% else %}
                        Без дедлайна
                    {% endif %}
                </span>
                <div>
                    <a href="{{ url_for('edit_task', task_id=task[0]) }}">✏️</a>
                    {% if not task[4] %}
                        <form method="POST" action="{{ url_for('complete_task', task_id=task[0]) }}" style="display: inline;">
                            <button type="submit" class="complete-btn" title="Отметить выполненным">✔️</button>
                        </form>
                    {% endif %}
                    <form method="POST" style="display: inline;">
                        <input type="hidden" name="delete_id" value="{{ task[0] }}">
                        <button type="submit" class="delete-btn" title="Удалить задачу">✖</button>
                    </form>
                </div>
            </li>
        {% endfor %}
    </ul>

    <script>
        // === Аналоговые часы ===
        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');

        function drawClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const millis = now.getMilliseconds();

            const radius = 70;
            const centerX = 80;
            const centerY = 80;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * 2 * Math.PI - Math.PI / 2;
                const isHour = i % 3 === 0;
                const len = isHour ? 10 : 6;
                const outerR = radius - 5;
                const innerR = outerR - len;
                ctx.beginPath();
                ctx.moveTo(centerX + innerR * Math.cos(angle), centerY + innerR * Math.sin(angle));
                ctx.lineTo(centerX + outerR * Math.cos(angle), centerY + outerR * Math.sin(angle));
                ctx.strokeStyle = '#333';
                ctx.lineWidth = isHour ? 3 : 1.5;
                ctx.stroke();
            }

            ctx.font = '14px Arial';
            ctx.fillStyle = '#333';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                const angle = (i / 12) * 2 * Math.PI - Math.PI / 2;
                const r = radius - 20;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                ctx.fillText(i.toString(), x, y);
            }

            const secAngle = (seconds + millis / 1000) / 60 * 2 * Math.PI - Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + (radius - 15) * Math.cos(secAngle), centerY + (radius - 15) * Math.sin(secAngle));
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            const minAngle = (minutes + seconds / 60) / 60 * 2 * Math.PI - Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + (radius - 25) * Math.cos(minAngle), centerY + (radius - 25) * Math.sin(minAngle));
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();

            const hourAngle = (hours + minutes / 60) / 12 * 2 * Math.PI - Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + (radius - 40) * Math.cos(hourAngle), centerY + (radius - 40) * Math.sin(hourAngle));
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#333';
            ctx.fill();

            const dateStr = now.toLocaleDateString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
            document.getElementById('current-date').textContent = dateStr;
        }

        drawClock();
        setInterval(drawClock, 1000);

        // === Автоподстановка времени в поле дедлайна ===
        document.addEventListener('DOMContentLoaded', function() {
            const deadlineInput = document.getElementById('deadline-input');
            if (deadlineInput) {
                const now = new Date();
                now.setSeconds(0, 0);
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                deadlineInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
            }
        });
    </script>
</body>
</html>
